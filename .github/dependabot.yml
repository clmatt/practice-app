# Weekly dependency updates. CI merges the safe ones by itself once every
# check passes (see the automerge job in workflows/deploy.yml and
# scripts/dependabot-automerge-policy.ts); npm major updates wait for you.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: hijacked releases are
    # usually pulled within days. Security updates don't wait.
    cooldown:
      default-days: 7
    groups:
      # One pull request a week for all minor and patch updates.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['actions/*']
