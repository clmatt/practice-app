name: Build, test and deploy

# Every push runs lint, tests, a build and the WebKit e2e test. Only pushes to main
# deploy to GitHub Pages; green Dependabot updates merge themselves (automerge job).
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Pinned: a version Playwright supports for WebKit's system packages
    # (ubuntu-latest started moving to Ubuntu 26 in October 2026).
    runs-on: ubuntu-24.04
    # Normally ~4 minutes; a stalled step fails fast instead of holding up deploys for hours.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install WebKit's system packages
        timeout-minutes: 15
        run: |
          # Let apt handle stalls itself: time out and retry slow downloads, and wait
          # for a busy package lock. Never kill apt mid-install (that breaks dpkg).
          conf=/etc/apt/apt.conf.d/99ci-resilience
          echo 'Acquire::Retries "5";' | sudo tee "$conf" > /dev/null
          echo 'Acquire::http::Timeout "30";' | sudo tee -a "$conf" > /dev/null
          echo 'Acquire::https::Timeout "30";' | sudo tee -a "$conf" > /dev/null
          echo 'DPkg::Lock::Timeout "300";' | sudo tee -a "$conf" > /dev/null
          npx playwright install-deps webkit
      - name: Download WebKit
        timeout-minutes: 10
        run: |
          # Just a download: safe to time out and try again.
          for attempt in 1 2 3; do
            timeout 180 npx playwright install webkit && exit 0
            echo "Download attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Note the runner OS (on failure)
        if: failure()
        run: echo "::warning title=Runner::$(lsb_release -ds 2>/dev/null || uname -a)"
      - run: npm run test:e2e
        timeout-minutes: 10
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # Dependabot updates that passed every check above merge themselves, then
  # deploy. Which updates qualify: scripts/dependabot-automerge-policy.ts
  # (npm majors stay open for you). A merge made with GITHUB_TOKEN doesn't
  # start a workflow run by itself, so this starts the deploy, which re-runs
  # every check on main before publishing anything.
  automerge:
    if: github.actor == 'dependabot[bot]' && startsWith(github.ref_name, 'dependabot/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      # The rules come from main, so a fix to them also applies to pull requests already open.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Find the pull request
        run: |
          # Dependabot opens the pull request just after pushing; give it a moment.
          for attempt in 1 2 3 4 5 6; do
            gh pr list --head "$BRANCH" --state open --json number,title,author,headRefOid --jq '.[0] // empty' > "$RUNNER_TEMP/pr.json"
            [ -s "$RUNNER_TEMP/pr.json" ] && break
            sleep 20
          done
          cat "$RUNNER_TEMP/pr.json"
      - name: Decide
        id: decide
        run: node scripts/dependabot-automerge.ts "$RUNNER_TEMP/pr.json" "$BRANCH" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Merge and deploy
        if: steps.decide.outputs.merge == 'true'
        # Outside the checkout, so gh only touches the remote branch.
        working-directory: ${{ runner.temp }}
        env:
          PR_NUMBER: ${{ steps.decide.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$GITHUB_SHA"
          gh workflow run deploy.yml --ref main
